[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fplopt"
dynamic = ["version"]
description = "Fantasy Premier League squad optimizer: multi-period MILP on a backtested expected-points model"
authors = [{ name = "Giannis Tsilogiannis" }]
# SPDX license expression and the file that holds its text (PEP 639; needs setuptools >= 77)
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
# PuLP 4 publishes wheels and metadata for Python 3.12 and later only (PyPI, 2026-10-22)
requires-python = ">=3.12"
# Ranges known to work; the exact versions of a tested install are pinned in requirements.txt.
# PuLP 4.2: the PuLP 4 API used by milp.py (9a(ii)). highspy: the only MIP solver (PuLP 4 ships
# none, and CBC was removed in 9a(ii)).
dependencies = [
    "requests>=2.31",
    "pandas>=2.2",
    "numpy>=1.26",
    "pulp>=4.2,<5",
    "highspy>=1.15",
]

[project.optional-dependencies]
dev = ["pytest>=9"]

[project.scripts]
fplopt = "fplopt.cli:main"

[tool.setuptools.dynamic]
version = { attr = "fplopt.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long solver runs on the synthetic season (deselected by default; run with: pytest -m slow)",
]
addopts = "-m 'not slow'"
