# Slow tests (full optimizer runs on the synthetic season, 5-15 minutes). Started by hand only:
# Actions tab -> slow-tests -> Run workflow. One Linux job is enough: they check solver results,
# which the fast tests already cover across platforms.
name: slow-tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slow:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install the pinned dependencies and the package
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e . --no-deps
      - name: Run the slow tests
        run: python -m pytest -m slow
